<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz</title>
</head>
<body>
    <select id="name">
        <option>Andrzej</option>
        <option>Jan</option>
        <option>Piotr</option>
        <option>Anna</option>
        <option>Olga</option>
        <option>Teresa</option>
    </select>
    <select id="surname">
        <option>Kowalski</option>
        <option>Kowalska</option>
        <option>Nowak</option>
        <option>Zurek</option>
        <option>Krawczyk</option>
        <option>Bednarska</option>
    </select>
    <button id="submit">dodaj</button><br>
    <select id="ids"></select>
    <button id="delete">usun</button>

    <script>
        function send(url, object){
            const options = {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(object)
            };
            
            fetch(url, options)
                .then(response => {
                    // Krok A: serwer odpowiedział, dekodujemy odpowiedź z formatu JSON na zwykły obiekt JS
                    return response.json();
                })
                .then(data => {
                    // Krok B: tutaj mamy gotowe dane i możemy coś z nimi zrobić na stronie!
                    window.alert(JSON.stringify(data, null, 5));
                    
                    ids.innerHTML = ""
                    data.forEach(u => {
                        const opt = document.createElement("option")
                        opt.value = u.id
                        opt.textContent = u.id
                        ids.appendChild(opt)
                    })
                })
                .catch(err => {
                    // Wykona się tylko, jeśli wystąpił błąd (np. brak neta, serwer leży)
                    console.error("Błąd:", err);
                });
        }

        document.getElementById("submit").onclick = function () {
            const dane = {
                message: "logowanie klienta",
                name: document.getElementById("name").value,
                surname: document.getElementById("surname").value,
                logtime: Date.now()
            }
            send("/add", dane)
        }

        document.getElementById("delete").onclick = function () {
            send("/del", {id: Number(ids.value)})
        }


    </script>
</body>
</html>
