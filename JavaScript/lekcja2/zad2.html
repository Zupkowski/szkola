<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript - Lekcja 2 - Cwiczenie 2</title>
    <script>
        let array = eval(window.prompt("Podaj tablicę:", "[1,2,3,4,5]"));
        let shift = window.prompt("Rotacja: p - prawo, l - lewo, k - koniec");
        let shiftAm = shift.slice(0, shift.length-1)
        let shiftDir = shift[shift.length-1].toLowerCase();
        let arrayLen = array.length;

        console.log(array)
        while (shiftDir != "k") {
            console.log(`--------------- ${shift} ---------------`)
            if (shiftDir === "p") {
                let counter = 0
                for (let i=0; i<shiftAm; i++) {
                    counter++
                    if (i>arrayLen) {
                        i=0
                    }
                    array.unshift(array.pop())
                    if (counter > shiftAm) {
                        break
                    }
                    console.log(array)
                }
            }
            else if (shiftDir === "l") {
                let counter = 0
                for (let i=0; i<shiftAm; i++) {
                    counter++
                    if (i>arrayLen) {
                        i=0
                    }
                    array.push(array.shift())
                    if (counter > shiftAm) {
                        break
                    }
                    console.log(array)
                }
            }
            shift = window.prompt("Rotacja: p - prawo, l - lewo, k - koniec");
            shiftAm = shift.slice(0, shift.length-1)
            shiftDir = shift[shift.length-1].toLowerCase();
        }
    </script>
</head>

</body>
</html>
