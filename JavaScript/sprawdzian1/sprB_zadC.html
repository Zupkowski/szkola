<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .number {
            width: 100px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <img src="grafiki/1.png" id="1" alt="1" class="number">
    <img src="grafiki/2.png" id="2" alt="2" class="number">
    <img src="grafiki/3.png" id="3" alt="3" class="number">
    <script>
        const code = [2,3,1]

        const pos1 = document.getElementById("1")
        const pos2 = document.getElementById("2")
        const pos3 = document.getElementById("3")

        pos1.addEventListener("click", ()=>{
            const pos = pos1
            num = parseInt(pos.alt)
            if (num == 3) {
                num = 1
            }
            else {
                num += 1
            }
            pos.alt = num
            pos.src = `grafiki/${pos.alt}.png`
            if (pos1.alt == code[0] && pos2.alt == code[1] && pos3.alt == code[2]) {
                setTimeout(()=>{alert("Poprawny kod!")},0)
            }
        })
        pos2.addEventListener("click", ()=>{
            const pos = pos2
            num = parseInt(pos.alt)
            if (num == 3) {
                num = 1
            }
            else {
                num += 1
            }
            pos.alt = num
            pos.src = `grafiki/${pos.alt}.png`
            if (pos1.alt == code[0] && pos2.alt == code[1] && pos3.alt == code[2]) {
                setTimeout(()=>{alert("Poprawny kod!")},0)
            }
        })
        pos3.addEventListener("click", ()=>{
            const pos = pos3
            num = parseInt(pos.alt)
            if (num == 3) {
                num = 1
            }
            else {
                num += 1
            }
            pos.alt = num
            pos.src = `grafiki/${pos.alt}.png`
            if (pos1.alt == code[0] && pos2.alt == code[1] && pos3.alt == code[2]) {
                setTimeout(()=>{alert("Poprawny kod!")},0)
            }
        })

    </script>
</body>
</html>
