<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="../jquery-4.0.0.js"></script>
    <style>
        div {
            margin-right: 5px;
        }
        .tile {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            color: white;
            background: rgb(0, 128, 255);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            
        }
        .selected {
            background: rgb(255, 128, 0);
        }
        #mainContainer, #resultContainer {
            display: flex;
            margin: 10px;;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <button id="generate">Generuj elementy</button>
    <button id="moveLeftButton"><- W lewo</button>
    <button id="moveRightButton">W prawo -></button>
    <select id="count"></select>
    <button id="clearButton">Wyczyść</button>
    <div id="mainContainer"></div>
    <div id="resultContainer"></div>

    <script>
        $(document).ready(()=>{
            for (let i=1;i<=10;i++) { //generating numbers in tile amount selector
                $("#count").append(`<option>${i}`)
            }


            $("#generate").on("click", function() {
                $("#mainContainer").empty()
                for (let i=0; i<$("#count").val(); i++) {
                    const tile = $("<div>").addClass("tile")
                    tile.text(i+1)
                    $("#mainContainer").append(tile)

                    tile.on("click", function() {
                        $(".tile").removeClass("selected")
                        $(this).addClass("selected")
                    })
                }
            })
            $("#moveLeftButton").on("click", function() {
                const selected = $(".selected")
                const prev = selected.prev()
                if (prev.length > 0) {
                    prev.before(selected)
                }
            })
            $("#moveRightButton").on("click", function() {
                const selected = $(".selected")
                const next = selected.next()
                if (next.length > 0) {
                    next.after(selected)
                }
            })
            $("#clearButton").on("click", function() {
                $("#mainContainer").empty()
            })
        })
    </script>
</body>
</html>
