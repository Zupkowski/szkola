<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="../jquery-4.0.0.js"></script>
    <style>
        div {
            margin-right: 5px;
        }
        .container {
            display: flex;
        }
    </style>
</head>
<body>
    <select name="count" id="count"></select>
    <input type="range" min="50" max="150" step="10" name="size" id="size">
    <input type="color" name="color" id="color">
    <button id="generate">Generuj</button>
    <div id="tileContainer" class="container"></div>

    <script>
        $(document).ready( ()=>{
            function generateColor() {
                let rand = "#"
                for (let i=0; i<6; i++) {
                    rand += Math.floor(Math.random()*15).toString(16)
                }
                return rand
            }

            for (let i=1;i<=10;i++) {
                $("#count").append(`<option>${i}`)
            }

            $("#generate").on("click", ()=> {
                let count = parseInt($("#count").val())
                let size = parseInt($("#size").val())
                let color = $("#color").val()

                $("#tileContainer").empty()

                for (let i=0; i<=count; i++) {
                    const tile = $("<div>").addClass("tile")
                    $(".tile").css("background", color)
                    $(".tile").css("width", size + "px")
                    $(".tile").css("height", size + "px")

                    tile.on("click", function() {
                        $("#tileContainer").children().css("background", color)
                        $(this).css("background", generateColor())
                        console.log("klik")
                    })

                    $("#tileContainer").append(tile)
                }
            })
        })
    </script>
</body>
</html>
