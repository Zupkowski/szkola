<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="../jquery-4.0.0.js"></script>
    <style>
        body {
            display: flex;
        }
        .tile {
            margin-right: 10px;
            width: 150px;
            height: 150px;

            background: blue;
            color: white;
            font-size: 75px;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <script>
        $(document).ready( ()=>{
            idClicked = ""
            for (let i=1; i<=3; i++) {
                $("body").append(`<div class="tile" id="tile${i}">`)
                $(`#tile${i}`).text(i).on("click", ()=>{
                    if (idClicked != i) {
                        $(`#tile${i}`).text(100).css("background", "red")
                        $(`#tile${idClicked}`).text(idClicked).css("background", "blue")
                        idClicked = i
                    }
                })
            }
        })
        
    </script>
</body>
</html>
