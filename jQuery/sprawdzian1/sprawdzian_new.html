<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../jquery-4.0.0.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      h1 {
        width: 100%;
        border-bottom: 1px solid black;
      }
      #main {
        display: flex;
      }
    </style>
  </head>
  <body>
    <h1>Sprawdzian - system zarządzania pakietami</h1>
    <div id="main">
      <div id="left">
        <div id="newProj">
          <h2>Dodaj nowy projekt</h2>
          Nazwa projektu:<br />
          <input type="text" id="newProjName" required /><br />
          <button id="newProjAddBtn">Utwórz projekt</button>
        </div>
        <div id="newTask">
          Wybierz projekt docelowy: <br />
          <select id="newTaskSelProj"></select
          ><br />
          Nazwa zadania: <br />
          <input type="text" id="newTaskName" /><br />
          Dni do terminu: <br />
          <p id="newTaskDays">Pozostało: 0 dni</p>
          <input
            type="range"
            min="-60"
            max="60"
            value="0"
            id="newTaskDaysRange"
          /><br />
          <button id="newTaskAddBtn">Utwórz zadanie</button>
        </div>
      </div>
      <div id="right"></div>
    </div>

    <script>
      $(document).ready(function () {
        let data = {
          data: [
            {
              id: 1,
              name: "platforma e-commerce v2.0",
              tasks: [
                {
                  id: 101,
                  name: "implementacja płatności blik",
                  status: "Do zrobienia",
                  dniDoTerminu: 5,
                },
                {
                  id: 102,
                  name: "testy wydajnościowe serwera",
                  status: "Ukończone",
                  dniDoTerminu: 10,
                },
                {
                  id: 103,
                  name: "naprawa błędów widoku mobilnego",
                  status: "Do zrobienia",
                  dniDoTerminu: -8,
                },
              ],
            },
            {
              id: 2,
              name: "kampania marketingowa",
              tasks: [
                {
                  id: 201,
                  name: "utworzenie grafik promocyjnych",
                  status: "Do zrobienia",
                  dniDoTerminu: 15,
                },
                {
                  id: 202,
                  name: "uruchomienie reklam google ads",
                  status: "Ukończone",
                  dniDoTerminu: 3,
                },
                {
                  id: 203,
                  name: "analiza konkurencji",
                  status: "Ukończone",
                  dniDoTerminu: 0,
                },
              ],
            },
            {
              id: 3,
              name: "automatyzacja raportowania",
              tasks: [
                {
                  id: 301,
                  name: "integracja z bazami danych",
                  status: "Do zrobienia",
                  dniDoTerminu: 20,
                },
                {
                  id: 302,
                  name: "testy jednostkowe skryptu",
                  status: "Do zrobienia",
                  dniDoTerminu: 40,
                },
              ],
            },
          ],
        };
        function genSelOpt() {
          $("#newTaskSelProj").empty();
          data.data.forEach((e) => {
            const option = $("<option>").val(e.id).text(e.name);
            $("#newTaskSelProj").append(option);
          });
        }

        function progressBar(count, max) {
          const perc = `${Math.floor((count / max) * 100)}%`;
          const main = $("<div>");
          const big = $("<div>")
            .css("width", "250px")
            .css("height", "35px")
            .css("background", "lightgrey");
          const small = $("<div>")
            .css("width", "0%")
            .css("height", "100%")
            .css("background", "chartreuse")
            .css("display", "flex")
            .css("align-items", "center")
            .css("justify-content", "right")
            .text(perc);
          main.text(`Postęp: ${perc}`);
          main.append(big.append(small.css("width", perc)));
          return main;
        }

        function render() {
          $("#right").empty();
          genSelOpt();
          data.data.forEach((e) => {
            const cont = $("<div>").attr("id", e.id);
            const title = $("<h2>").text(e.name);
            let counter = 0;
            e.tasks.forEach((s) => {
              console.log(s.status);
              if (s.status == "Ukończone") {
                counter++;
              }
            });
            const bar = progressBar(counter, e.tasks.length);
            cont.append(title).append(bar);
            e.tasks.forEach((t) => {
              const task = $("<div>")
                .css("display", "flex")
                .css("justify-content", "space-between")
                .css("gap", "50px")
                .css("width", "100%");
              const name = $("<p>").text(t.name);
              const dniDoTerminu = $("<p>").text(
                `Do terminu: ${t.dniDoTerminu}`,
              );
              if (t.dniDoTerminu == 0) {
                dniDoTerminu.css("background", "orange");
              } else if (t.dniDoTerminu > 0) {
                dniDoTerminu.css("background", "green");
              } else {
                dniDoTerminu.css("background", "red");
              }
              //   const doZrobienia = $("<option>").text("Do zrobienia");
              //   const ukonczone = $("<option>").text("Ukończone");
              //   if (t.status == "Ukończone") {
              //     doZrobienia.attr("selected", "selected");
              //   } else {
              //     ukonczone.attr("selected", "selected");
              //   }
              //   const status = $("<select>")
              //     .append(doZrobienia)
              //     .append(ukonczone);
              //   status.on("change", () => {
              //     t.status = status.val();
              //     render();
              //   });
              task.append(name).append(dniDoTerminu).append(status);
              cont.append(task);
            });
            $("#right").append(cont);
          });
          $("#newTaskDays").text(
            `Pozostało: ${$("#newTaskDaysRange").val()} dni`,
          );
        }

        function newProjAdd() {
          const newName = $("#newProjName").val();
          const newId = data.data.length;
          data.data.push({
            id: newId,
            name: newName,
            tasks: [],
          });
          render();
        }
        function newTaskAdd() {
          const proj = $("#newTaskSelProj").val();
          const newName = $("#newTaskName").val();
          const days = parseInt($("#newTaskDaysRange").val());
          const status = "Do zrobienia";
          const lastId =
            data.data[proj - 1].tasks[data.data[proj - 1].tasks.length - 1].id;

          data.data[proj - 1].tasks.push({
            id: lastId + 1,
            name: newName,
            status: status,
            dniDoTerminu: days,
          });
          console.log(data);
          render();
        }

        // function makeTasks(task) {
        //   task.tasks.forEach((t) => {
        //     const task = $("<div>");
        //   });
        // }

        $("#newTaskDaysRange").on("input", () => {
          $("#newTaskDays").text(
            `Pozostało: ${$("#newTaskDaysRange").val()} dni`,
          );
        });

        render();
        $("#newProjAddBtn").on("click", newProjAdd);
        $("#newTaskAddBtn").on("click", newTaskAdd);
      });
    </script>
  </body>
</html>
