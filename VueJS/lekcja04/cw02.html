<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style></style>
  </head>

  <body>
    <div id="app">
      <button @click="showHide"></button>
      <div :style="{visibility: show}">ELEMENT</div>
    </div>
    <script>
      const app = Vue.createApp({
        data() {
          return {
            show: "show",
          };
        },
        methods: {
          showHide() {
            this.show == "show" ? (this.show = "hidden") : (this.show = "show");
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
